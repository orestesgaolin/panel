name: docs
description: A new Jaspr project
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
     sdk: flutter
  jaspr: ^0.23.4
  jaspr_flutter_embed: ^0.4.11
  jaspr_router: ^0.8.2
  # Flutter web/CanvasKit can't use OS-installed fonts, so the embedded code
  # samples need a real font the engine loads. google_fonts registers one at
  # runtime (web-friendly), avoiding a bundled TTF asset.
  google_fonts: ^6.2.1
  # The platform-generic core, embedded as a live Flutter-web demo.
  panel:
    path: ../../packages/panel

dev_dependencies:
  # 2.15.2+ moves to analyzer 13, while Jaspr 0.23 uses analyzer 12.
  # 2.15.1 still resolves build_daemon 4.1.3+, required by Jaspr CLI 0.23.4.
  build_runner: '>=2.15.1 <2.15.2'
  build_web_compilers: '>=4.8.5 <4.8.6'
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  jaspr_builder: ^0.23.4

jaspr:
  mode: static
  flutter: embedded
  # Static pre-render server port. 8080 is taken by OrbStack on this machine.
  port: 8137

flutter:
  uses-material-design: true
