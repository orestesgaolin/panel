name: Deploy docs

# Builds the Jaspr docs site (docs/docs) and deploys it to GitHub Pages.
# Manual only: trigger from the Actions tab ("Run workflow").
#
# One-time setup: repo Settings → Pages → Build and deployment → Source =
# "GitHub Actions". For a custom domain or a <user>.github.io repo (served at
# the root), run the workflow with base_href = "/".
on:
  workflow_dispatch:
    inputs:
      base_href:
        description: 'Base href for the site. Empty = /<repo>/ (project Pages). Use "/" for a custom domain / user page.'
        required: false
        default: '/panel/'

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true # caches the Flutter SDK

      - run: flutter config --enable-web

      # Cache downloaded pub packages + the globally-activated jaspr_cli.
      # (Build artifacts — build_runner/dart2js/flutter-web — are intentionally
      # not cached; cross-run reuse there is unreliable and risks stale output.)
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('docs/docs/pubspec.lock', 'packages/panel/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      # Jaspr CLI, pinned to match the project and its build daemon.
      - run: dart pub global activate jaspr_cli 0.23.4

      - name: Resolve dependencies
        working-directory: docs/docs
        run: flutter pub get

      - name: Build static site
        working-directory: docs/docs
        run: |
          base="${{ github.event.inputs.base_href }}"
          if [ -z "$base" ]; then base="/${{ github.event.repository.name }}/"; fi
          echo "Building with base href: $base"
          dart pub global run jaspr_cli:jaspr build --dart-define=BASE_HREF="$base"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/docs/build/jaspr

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
